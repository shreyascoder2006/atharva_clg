<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Shipment Explainer</title>
<style>
/*FONTS*/
:root{--bg:#F3EDE3;--ink:#2B231D;--mut:#8A7D70;--line:#E4D9C8;--card:#FFFDF9;--clay:#A9552F;--sage:#637A5B;--ochre:#B9822F;--mocha:#8A7360;--sand:#E9E0D2;--hl:rgba(169,85,47,.2)}
*{box-sizing:border-box}
html,body{margin:0;background:#191512;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink);transform-origin:0 0}
.layer{position:absolute;inset:0;display:none}
.cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.abs{position:absolute;white-space:nowrap}
.card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(60,40,20,.08)}
.serif{font-family:Fraunces,serif}
.mono{font-family:'JetBrains Mono',monospace}
.title{left:960px;top:540px;transform:translate(-50%,-50%);font:500 30px Fraunces;letter-spacing:-.01em}
.w{display:inline-block;position:relative;isolation:isolate}
.hl{position:absolute;left:-5px;right:-5px;top:10%;bottom:4%;background:var(--hl);border-radius:5px;transform-origin:0 50%;z-index:-1}
.ic{display:inline-flex;align-items:center;justify-content:center}
.ic svg{width:100%;height:100%}
.pill{position:absolute;border-radius:999px;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:600}
.btn{position:absolute;border-radius:12px;background:var(--clay);color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap}
.lbl{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
#cursor{position:absolute;left:0;top:0;width:30px;height:30px;z-index:50;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
#ui{position:fixed;left:0;right:0;bottom:0;height:56px;background:#221c18;display:flex;align-items:center;gap:14px;padding:0 16px;color:#eee;font:13px Inter}
#ui button{background:#A9552F;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 13px Inter;cursor:pointer}
#ui input{flex:1}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"><button id="pp">Play</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="tc">0.0 s</span></div>
<script>
/* BEAT SHEET (seconds · what happens · sound)
 0.0  Introducing fades up                                   · soft pad enters
 2.0  Brand moment: silk gradient + "One Shipment, One Digital Platform" · pad swell
 5.0  Title: One export. Four parties. No shared record.     · whoosh on push
 9.5  UI: export group chat fills with conflicting weights   · bubble pops, light percussion enters
14.5  Title: So we put one record at the centre.             · whoosh
17.5  UI: hub diagram from the deck builds (roles, capabilities) · ticks per node
24.0  Title: Catch the mismatch before customs does.         · whoosh
27.0  UI: AI X-Ray scan, 12,400 vs 12,850 kg, resolve, SHA-256 · clicks, scan ticks, success chime
36.0  Title: Payment moves the moment proof does.            · whoosh
39.0  UI: driver confirms gate-in, Rs 18,500 released, baton to CHA · click, chime
47.0  Title: Disrupted? Every option, priced in seconds.     · whoosh
50.0  UI: Red Sea Co-Pilot, two options, execute, Cape reroute · clicks, chime
58.5  Title: Seven workspaces. One truth.                    · whoosh
61.5  UI: role-aware Shipments workspace, rows fill, roles switch · clicks
68.0  Proof: 43 systems, 129 APIs already on ULIP (count-up)  · lift begins
73.0  Integrations: tiles float in with parallax             · shimmer
79.0  Closer: Run your [documents/payments/disruptions/carbon] on one shipment record · lift
85.0  End card                                                · chime
*/
const VIDEO = { w: 1920, h: 1080, duration: 89 };
window.VIDEO = VIDEO;
const ICONS = /*ICONS*/;
const HASH = '/*HASH*/';

function spring(t, w = 14, z = 0.82) { if (t <= 0) return 0; if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t); const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
const track = (v0, keys) => t => { let v = v0, p = v0; for (const [tk, val, w, z] of keys) { v += (val - p) * spring(t - tk, w, z); p = val; } return v; };
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const outBack = x => { x = clamp(x); const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const fmt = n => Math.round(n).toLocaleString('en-US');
const fmtIN = n => Math.round(n).toLocaleString('en-IN');

const stage = document.getElementById('stage');
const $ = h => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const ic = (name, size, color) => `<span class="ic" style="width:${size}px;height:${size}px;color:${color || 'currentColor'}">${ICONS[name]}</span>`;
const scenes = [];
function layer(z = 1) { const L = $('<div class="layer"><div class="cam"></div></div>'); L.style.zIndex = z; stage.appendChild(L); return { L, cam: L.firstElementChild }; }
function setCam(cam, fx, fy, k) { cam.style.transform = `translate(${(960 - fx * k).toFixed(2)}px,${(540 - fy * k).toFixed(2)}px) scale(${k.toFixed(4)})`; }
function show(L, t, s, e, fi = 0.45, fo = 0.45) {
  const v = Math.min(fi > 0 ? seg(t, s, s + fi) : (t >= s ? 1 : 0), fo > 0 ? 1 - seg(t, e - fo, e) : (t < e ? 1 : 0));
  if (v <= 0.001) { L.style.display = 'none'; return 0; }
  L.style.display = 'block'; L.style.opacity = v.toFixed(3);
  const b = (1 - v) * 9; L.style.filter = b > 0.3 ? `blur(${b.toFixed(1)}px)` : 'none';
  return v;
}
const camKeys = keys => { const fx = kf(keys.map(k => [k[0], k[1], k[4]])), fy = kf(keys.map(k => [k[0], k[2], k[4]])), kk = kf(keys.map(k => [k[0], k[3], k[4]])); return t => [fx(t), fy(t), kk(t)]; };
function el(parent, html, x, y, w, h) { const e = $(html); e.style.left = x + 'px'; e.style.top = y + 'px'; if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px'; parent.appendChild(e); return e; }
function op(e, v) { e.style.opacity = clamp(v).toFixed(3); }
function pop(e, v, dy = 14) { op(e, v); e.style.transform = `translateY(${((1 - v) * dy).toFixed(1)}px)`; }

// ---------- cursor (screen space) ----------
const cursor = $(`<svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.5 15 L11.5 22 L14.5 20.7 L11.6 14 L18 14 Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>`);
stage.appendChild(cursor);
const cursorPaths = []; // {s,e, pts:[[t,x,y]] (ui coords), cam: fn, clicks:[t]}
function cursorTrack(s, e, keys, camFn, clicks = []) { cursorPaths.push({ s, e, keys, camFn, clicks }); }
function updateCursor(t) {
  const p = cursorPaths.find(c => t >= c.s && t <= c.e);
  if (!p) { cursor.style.display = 'none'; return; }
  const fx = kf(p.keys.map(k => [k[0], k[1]])), fy = kf(p.keys.map(k => [k[0], k[2]]));
  const [cx, cy, k] = p.camFn(t);
  const ux = fx(t), uy = fy(t);
  const sx = 960 + (ux - cx) * k, sy = 540 + (uy - cy) * k;
  let press = 0; for (const c of p.clicks) { const d = t - c; if (d > -0.08 && d < 0.18) press = Math.max(press, 1 - Math.abs(d - 0.03) / 0.15); }
  const vis = Math.min(seg(t, p.s, p.s + 0.25), 1 - seg(t, p.e - 0.25, p.e));
  cursor.style.display = vis > 0 ? 'block' : 'none';
  cursor.style.opacity = vis;
  cursor.style.transform = `translate(${(sx - 4).toFixed(1)}px,${(sy - 2).toFixed(1)}px) scale(${(1.15 - press * 0.15).toFixed(3)})`;
}
// ripple inside a cam at ui coords
function ripple(parent, x, y, at) {
  const r = el(parent, `<div class="abs" style="border-radius:50%;border:3px solid var(--clay);pointer-events:none"></div>`, x, y, 0, 0);
  return t => { const d = t - at; if (d < 0 || d > 0.6) { r.style.display = 'none'; return; } r.style.display = 'block'; const R = 10 + d * 110; r.style.width = r.style.height = 2 * R + 'px'; r.style.left = x - R + 'px'; r.style.top = y - R + 'px'; r.style.opacity = (1 - d / 0.6) * 0.8; };
}

// ---------- silk gradient canvas (drawn once) ----------
function silkCanvas() {
  const c = document.createElement('canvas'); c.width = 2400; c.height = 1350; const g = c.getContext('2d');
  g.fillStyle = '#F8F2E9'; g.fillRect(0, 0, c.width, c.height);
  const R = rng(7);
  const bands = [['rgba(169,85,47,0.16)', 380], ['rgba(255,255,255,0.85)', 320], ['rgba(214,150,96,0.16)', 360], ['rgba(255,252,246,0.9)', 300], ['rgba(169,85,47,0.10)', 300], ['rgba(255,255,255,0.8)', 340]];
  g.filter = 'blur(70px)';
  bands.forEach(([col, w], i) => {
    g.save(); g.translate(c.width * (0.15 + i * 0.15 + R() * 0.05), c.height / 2); g.rotate(-0.55 + R() * 0.12);
    const clear = col.replace(/[\d.]+\)$/, '0)'); const lg = g.createLinearGradient(-w, 0, w, 0); lg.addColorStop(0, clear); lg.addColorStop(0.5, col); lg.addColorStop(1, clear);
    g.fillStyle = lg; g.fillRect(-w, -1400, 2 * w, 2800); g.restore();
  });
  g.filter = 'none';
  c.style.position = 'absolute'; c.style.left = '-240px'; c.style.top = '-135px';
  return c;
}
function dotsCanvas() {
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; const g = c.getContext('2d');
  for (let x = 24; x < 1920; x += 32) for (let y = 24; y < 1080; y += 32) {
    const dx = (x - 960) / 960, dy = (y - 540) / 540, d = Math.sqrt(dx * dx + dy * dy);
    g.fillStyle = `rgba(138,115,96,${Math.max(0, 0.32 - d * 0.22).toFixed(3)})`; g.beginPath(); g.arc(x, y, 1.6, 0, 7); g.fill();
  }
  c.style.position = 'absolute'; c.style.left = '0'; c.style.top = '0';
  return c;
}

// ---------- title scene ----------
function titleScene(s, e, words, hi, o = {}) {
  const { L, cam } = layer(5);
  const line = el(cam, `<div class="abs title"></div>`, 960, 540);
  const spans = [], groups = [];
  const word = (parent, w) => { const sp = document.createElement('span'); sp.style.display = 'inline-block'; sp.textContent = w; parent.appendChild(sp); spans.push(sp); };
  let i = 0;
  while (i < words.length) {
    if (hi.includes(i)) {
      // one continuous highlight behind a run of highlighted words
      const g = document.createElement('span'); g.className = 'w'; g.innerHTML = '<i class="hl"></i>';
      const inner = document.createElement('span'); g.appendChild(inner);
      while (i < words.length && hi.includes(i)) { word(inner, words[i]); if (hi.includes(i + 1)) inner.appendChild(document.createTextNode(' ')); i++; }
      line.appendChild(g); groups.push(g);
    } else { word(line, words[i]); i++; }
    if (i < words.length) line.appendChild(document.createTextNode(' '));
  }
  scenes.push({ s, e, update(t) {
    if (!show(L, t, s, e, 0.35, 0.4)) return;
    const K = 0.72 * 1920 / Math.max(1, line.offsetWidth);
    setCam(cam, 960, 540, kf([[s + 0.2, 1], [s + 1.45, K], [e, K * 1.05, x => x]])(t));
    spans.forEach((sp, j) => { const v = easeOut(seg(t, s + 0.1 + j * 0.07, s + 0.45 + j * 0.07)); sp.style.opacity = v; sp.style.transform = `translateY(${(1 - v) * 10}px)`; });
    const p = seg(t, s + 1.45, s + 2.05);
    groups.forEach((g, j) => { g.querySelector('.hl').style.transform = `scaleX(${ease(clamp(p * groups.length - j)).toFixed(3)})`; });
  } });
}

// =====================================================================
// 0. Open
// =====================================================================
{
  const { L, cam } = layer(2);
  const intro = el(cam, `<div class="abs" style="font:400 30px Inter;color:var(--mut);transform:translate(-50%,-50%)">Introducing</div>`, 960, 540);
  scenes.push({ s: 0, e: 2.4, update(t) { if (!show(L, t, 0, 2.4, 0.6, 0.45)) return; setCam(cam, 960, 540, lerp(1, 1.08, seg(t, 0, 2.4))); } });
  void intro;
}
function brandScene(s, e, inner) {
  const { L, cam } = layer(3);
  const silk = silkCanvas(); L.insertBefore(silk, cam);
  const box = el(cam, `<div class="abs" style="transform:translate(-50%,-50%);text-align:center">${inner}</div>`, 960, 540);
  scenes.push({ s, e, update(t) {
    if (!show(L, t, s, e, 0.5, 0.45)) return;
    silk.style.transform = `translate(${(-(t - s) * 22).toFixed(1)}px,${(Math.sin(t * 0.4) * 10).toFixed(1)}px)`;
    setCam(cam, 960, 540, lerp(0.97, 1.02, ease(seg(t, s, e))));
    op(box, seg(t, s + 0.3, s + 0.9));
  } });
}
brandScene(2.0, 5.2, `<div style="font:500 80px Fraunces;letter-spacing:-.02em;line-height:1.05">One Shipment,<br><i style="color:var(--clay)">One Digital Platform</i></div><div style="margin-top:22px;font:500 19px Inter;color:var(--mut);letter-spacing:.14em">LOGITHON 2026 · TEAM OUTLIERS</div>`);

// =====================================================================
// 1. Problem title + chat chaos
// =====================================================================
titleScene(5.0, 9.6, ['One', 'export.', 'Four', 'parties.', 'No', 'shared', 'record.'], [4, 5, 6]);
{
  const s = 9.5, e = 14.6;
  const { L, cam } = layer(4);
  const win = el(cam, `<div class="card" style="border-radius:26px"></div>`, 560, 120, 800, 1000);
  el(win, `<div class="abs" style="left:28px;top:24px;display:flex;align-items:center;gap:14px">${ic('MessagesSquare', 30, '#8A7360')}<div><div style="font:600 21px Inter">SHP-0482 · Export group</div><div style="font:400 15px Inter;color:var(--mut)">Exporter, Forwarder, Customs Broker, Transporter</div></div></div>`, 0, 0);
  el(win, `<div class="abs" style="left:0;right:0;top:92px;height:1px;background:var(--line)"></div>`, 0, 92, 800, 1);
  const msgs = [
    ['Forwarder', 'var(--mocha)', 'Need the final <b>gross weight</b> for the BL draft.', 0],
    ['Exporter', 'var(--clay)', 'Invoice says <b>12,400 kg</b>.', 1],
    ['Customs Broker', 'var(--sage)', 'Packing list says <b>12,850 kg</b>. Which one do I file?', 0],
    ['Transporter', 'var(--ochre)', 'At JNPT Gate 4. Sending the photo…', 1],
    ['Forwarder', 'var(--mocha)', 'Vessel cutoff is in <b>6 hours</b>.', 0],
    ['Exporter', 'var(--clay)', 'Calling everyone now.', 1],
  ];
  const bubbles = msgs.map(([who, col, text, right], i) => {
    const b = el(win, `<div class="abs" style="max-width:520px;white-space:normal"><div style="font:600 14px Inter;color:${col};margin:0 0 6px ${right ? 'auto' : '0'};text-align:${right ? 'right' : 'left'}">${who}</div><div style="background:${right ? '#F7EFE6' : '#fff'};border:1px solid var(--line);border-radius:18px;padding:14px 20px;font:400 21px Inter;line-height:1.35">${text}</div></div>`, right ? 250 : 30, 120 + i * 128, 520);
    return b;
  });
  const stamp = el(win, `<div class="abs" style="left:240px;top:910px;transform-origin:50% 50%;border:3px solid #B3372B;color:#B3372B;border-radius:12px;padding:10px 22px;font:700 24px Inter;letter-spacing:.04em">MISSED CUTOFF · ROLLED +96 h</div>`, 210, 905);
  const camF = camKeys([[s, 960, 420, 1.25], [s + 3.0, 960, 720, 1.12], [e, 960, 760, 1.0]]);
  scenes.push({ s, e, update(t) {
    if (!show(L, t, s, e, 0.45, 0.45)) return;
    const [x, y, k] = camF(t); setCam(cam, x, y, k);
    bubbles.forEach((b, i) => pop(b, easeOut(seg(t, s + 0.35 + i * 0.55, s + 0.65 + i * 0.55)), 22));
    const sv = seg(t, s + 3.9, s + 4.15); op(stamp, sv); stamp.style.transform = `rotate(-4deg) scale(${lerp(1.5, 1, outBack(sv))})`;
  } });
}

// =====================================================================
// 2. Hub (from the deck)
// =====================================================================
titleScene(14.5, 17.6, ['So', 'we', 'put', 'one', 'record', 'at', 'the', 'centre.'], [3, 4]);
{
  const s = 17.5, e = 24.1;
  const { L, cam } = layer(4);
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('width', 1920); svg.setAttribute('height', 1080); svg.style.position = 'absolute'; cam.appendChild(svg);
  const ring = (r, dash) => { const c = document.createElementNS(svgNS, 'ellipse'); c.setAttribute('cx', 960); c.setAttribute('cy', 540); c.setAttribute('rx', r[0]); c.setAttribute('ry', r[1]); c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#B8A690'); c.setAttribute('stroke-width', 2); c.setAttribute('stroke-dasharray', dash); svg.appendChild(c); return c; };
  const r1 = ring([330, 330], '6 8'), r2 = ring([640, 410], '6 8');
  const roles = [['Exporter', '#A9552F', 'Factory', -135], ['Freight Forwarder', '#8A7360', 'Ship', -45], ['Customs Broker', '#637A5B', 'Stamp', 45], ['Transporter', '#B9822F', 'Truck', 135]];
  const caps = [['AI Document X-Ray', 'ScanLine', -90], ['Proof escrow', 'LockOpen', -30], ['ULIP events', 'Network', 30], ['Recovery Co-Pilot', 'Sparkles', 90], ['Partner marketplace', 'Handshake', 150], ['CO2e + CBAM', 'Leaf', 210]];
  const lines = roles.map(([, col, , a]) => { const l = document.createElementNS(svgNS, 'line'); const x = 960 + 330 * Math.cos(a * Math.PI / 180), y = 540 + 330 * Math.sin(a * Math.PI / 180); l.setAttribute('x1', 960); l.setAttribute('y1', 540); l.setAttribute('x2', x); l.setAttribute('y2', y); l.setAttribute('stroke', col); l.setAttribute('stroke-width', 5); l.setAttribute('stroke-linecap', 'round'); l.setAttribute('stroke-dasharray', 330); svg.appendChild(l); return l; });
  const capLines = caps.map(([, , a]) => { const l = document.createElementNS(svgNS, 'line'); const x = 960 + 640 * Math.cos(a * Math.PI / 180), y = 540 + 410 * Math.sin(a * Math.PI / 180); l.setAttribute('x1', 960); l.setAttribute('y1', 540); l.setAttribute('x2', x); l.setAttribute('y2', y); l.setAttribute('stroke', '#D8CBB6'); l.setAttribute('stroke-width', 2); svg.appendChild(l); return l; });
  const pulses = roles.map(([, col]) => { const c = document.createElementNS(svgNS, 'circle'); c.setAttribute('r', 7); c.setAttribute('fill', col); svg.appendChild(c); return c; });
  const glow = el(cam, `<div class="abs" style="border-radius:50%;background:rgba(169,85,47,.16);transform:translate(-50%,-50%)"></div>`, 960, 540, 330, 330);
  const hub = el(cam, `<div class="abs" style="border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 18px 40px rgba(43,35,29,.3)">${ic('Package', 52, '#FFFDF9')}<div style="margin-top:12px;font:700 19px Inter;letter-spacing:.12em;text-align:center;line-height:1.3">ONE SHIPMENT<br>RECORD</div><div style="margin-top:8px;font:400 14px Inter;color:#C9BBA8">16 milestones · 8 docs · 4 payouts</div></div>`, 960, 540, 280, 280);
  const roleEls = roles.map(([n, col, i, a]) => { const x = 960 + 330 * Math.cos(a * Math.PI / 180), y = 540 + 330 * Math.sin(a * Math.PI / 180); return el(cam, `<div class="abs" style="transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center"><div style="width:108px;height:108px;border-radius:50%;background:${col};border:5px solid #FFFDF9;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(43,35,29,.2)">${ic(i, 48, '#fff')}</div><div style="margin-top:10px;background:#FFFDF9;border:2px solid ${col};border-radius:999px;padding:6px 16px;font:600 17px Inter">${n}</div></div>`, x, y + 22); });
  const capEls = caps.map(([n, i, a]) => { const x = 960 + 640 * Math.cos(a * Math.PI / 180), y = 540 + 410 * Math.sin(a * Math.PI / 180); return el(cam, `<div class="card" style="transform:translate(-50%,-50%);display:flex;align-items:center;gap:14px;padding:14px 22px 14px 14px;border-radius:16px"><div style="width:52px;height:52px;border-radius:50%;background:var(--clay);display:flex;align-items:center;justify-content:center">${ic(i, 26, '#fff')}</div><div style="font:600 19px Inter;white-space:nowrap">${n.replace('CO2e', 'CO<sub>2</sub>e')}</div></div>`, x, y); });
  const camF = camKeys([[s, 960, 540, 1.9], [s + 1.2, 960, 540, 1.7], [s + 3.4, 960, 540, 0.98], [e, 960, 540, 0.94, x => x]]);
  scenes.push({ s, e, update(t) {

  }
  function nz(t0, dur, f, q, g, type = 'bandpass', sweepTo) {
    const s = ctx.createBufferSource(); s.buffer = noise; const bf = ctx.createBiquadFilter(); bf.type = type; bf.frequency.setValueAtTime(f, t0); if (sweepTo) bf.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur); bf.Q.value = q;
    const a = ctx.createGain(); a.gain.setValueAtTime(0, t0); a.gain.linearRampToValueAtTime(g, t0 + Math.min(0.05, dur / 3)); a.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
    s.connect(bf); bf.connect(a); a.connect(out); s.start(t0); s.stop(t0 + dur + 0.05);
  }
  const bar = beat * 4;
  // pad
  for (let b = 0, t0 = 0; t0 < D - 1; b++, t0 += bar * 2) {
    const ch = chords[b % 4], dur = Math.min(bar * 2 + 0.6, D - t0);
    const lift = t0 >= 78 ? 1.25 : 1;
    ch.forEach((n, i) => { tone(midi(n), t0, dur, 'triangle', 0.035 * lift * (t0 < 2 ? 0.7 : 1), lp, 0.8, 1.0); tone(midi(n) * 1.004, t0, dur, 'sine', 0.02 * lift, lp, 0.9, 1.0); });
    tone(midi(ch[0] - 12), t0, dur, 'sine', 0.06, lp, 0.3, 0.8);
    if (t0 >= 78) ch.forEach(n => tone(midi(n + 12), t0, dur, 'sine', 0.012, lp, 1.0, 1.0));
  }
  // pluck arpeggio from 5 s
  for (let i = 0, t0 = 5.0; t0 < D - 3.5; i++, t0 += beat / 2) {
    const ch = chords[Math.floor(t0 / (bar * 2)) % 4]; const n = ch[[0, 2, 1, 3, 2, 1, 3, 2][i % 8]] + 12;
    tone(midi(n), t0, 0.35, 'triangle', (i % 2 ? 0.022 : 0.03) * (t0 > 78 ? 1.2 : 1), lp, 0.005, 0.3);
  }
  // percussion from 9.5 s
  for (let t0 = 9.5; t0 < D - 4; t0 += beat) {
    const bi = Math.round((t0 - 9.5) / beat);
    if (bi % 2 === 0 || t0 > 78) { const o = ctx.createOscillator(); o.type = 'sine'; const a = ctx.createGain(); o.frequency.setValueAtTime(120, t0); o.frequency.exponentialRampToValueAtTime(45, t0 + 0.18); a.gain.setValueAtTime(0.22, t0); a.gain.exponentialRampToValueAtTime(0.001, t0 + 0.25); o.connect(a); a.connect(out); o.start(t0); o.stop(t0 + 0.3); }
    if (t0 > 14.5) nz(t0 + beat / 2, 0.06, 8000, 0.8, 0.035, 'highpass');
  }
  // SFX
  const whoosh = t0 => nz(t0, 0.7, 400, 0.7, 0.10, 'bandpass', 3200);
  const click = t0 => { nz(t0, 0.04, 3000, 2, 0.12); tone(1800, t0, 0.05, 'sine', 0.04, out, 0.002, 0.04); };
  const tick = t0 => tone(2600, t0, 0.04, 'sine', 0.025, out, 0.002, 0.03);
  const chime = (t0, g = 0.06) => [1, 2.76, 5.4].forEach((m, i) => tone(midi(84) * m / 2, t0, 1.6, 'sine', g / (i + 1), out, 0.005, 1.5));
  const popS = t0 => tone(880, t0, 0.09, 'sine', 0.04, out, 0.003, 0.08);
  [5.0, 14.5, 24.0, 36.0, 47.0, 58.5, 68.0, 79.0].forEach(t0 => whoosh(t0 + 0.15));
  [17.5 + 3.4, 27.0 + 2.2, 27.0 + 7.0, 39.0 + 3.4, 39.0 + 5.8, 50.0 + 5.8, 61.5 + 6.0].forEach(t0 => nz(t0 - 0.2, 0.6, 600, 0.6, 0.05, 'bandpass', 2000));
  [28.6, 32.8, 40.8, 53.6, 54.6, 65.2, 65.8, 66.4].forEach(click);
  for (let i = 0; i < 6; i++) popS(9.85 + i * 0.55);
  for (let i = 0; i < 4; i++) popS(18.7 + i * 0.18);
  for (let i = 0; i < 9; i++) tick(28.8 + i * 0.15);
  for (let i = 0; i < 18; i++) tick(33.8 + i * 0.055);
  chime(33.1, 0.05); chime(43.6, 0.06); chime(55.1, 0.05); chime(85.2, 0.08);
  nz(13.4, 0.25, 220, 1.2, 0.12, 'lowpass');
};

// ---------- preview / render mode ----------
const RENDER = location.search.includes('render');
const ui = document.getElementById('ui');
if (RENDER) { ui.remove(); document.body.style.background = '#000'; }
else {
  const fit = () => { const k = Math.min(innerWidth / 1920, (innerHeight - 56) / 1080); stage.style.transform = `scale(${k})`; };
  addEventListener('resize', fit); fit();
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  const pp = document.getElementById('pp'), sc = document.getElementById('scrub'), tc = document.getElementById('tc');
  async function play() {
    ac ??= new AudioContext();
    if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * VIDEO.duration), 48000); await buildAudio(off); buf = await off.startRendering(); }
    src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
    src.start(0, offset % VIDEO.duration); startAt = ac.currentTime; playing = true; pp.textContent = 'Pause';
  }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; pp.textContent = 'Play'; }
  const now = () => playing ? (offset + ac.currentTime - startAt) % VIDEO.duration : offset;
  pp.onclick = () => playing ? pause() : play();
  sc.oninput = () => { const was = playing; pause(); offset = sc.value / 1000 * VIDEO.duration; if (was) play(); };
  (function loop() { const t = now(); seek(t); sc.value = t / VIDEO.duration * 1000; tc.textContent = t.toFixed(1) + ' s'; requestAnimationFrame(loop); })();
}
seek(0);
</script>
